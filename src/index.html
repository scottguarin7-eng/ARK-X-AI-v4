
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: #07111f;
  color: #eaf6ff;
  font-family: system-ui, -apple-system, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

::selection {
  background: #22d3ee;
  color: #07111f;
}
